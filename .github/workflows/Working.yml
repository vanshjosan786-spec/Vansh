name: AnyDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Configure Windows User Account
        run: |
          # Set a secure password for the runneradmin account
          $Password = ConvertTo-SecureString "YourChosenPassword123" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          
          # Enable Remote Desktop permissions just in case the OS blocks headless sessions
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Install AnyDesk via Chocolatey
        run: |
          choco install anydesk --yes

      - name: Configure Windows Firewall for AnyDesk
        run: |
          New-NetFirewallRule -DisplayName "AnyDesk Inbound" -Direction Inbound -Program "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" -Action Allow
          New-NetFirewallRule -DisplayName "AnyDesk Outbound" -Direction Outbound -Program "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" -Action Allow

      - name: Set AnyDesk Password & Restart Service
        run: |
          Stop-Service -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password "YourChosenPassword123"
          Start-Service -Name "AnyDesk"

      - name: Get AnyDesk ID
        run: |
          Start-Sleep -s 5
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id

      - name: Keep Runner Alive
        run: |
          Start-Sleep -s 3600
