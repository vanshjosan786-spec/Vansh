name: AnyDesk Forced Unattended

on:
  workflow_dispatch:

jobs:
  connect:
    runs-on: windows-latest
    steps:
      - name: Create Windows Admin Password
        run: |
          $Password = ConvertTo-SecureString "GitHubAdminPassword123!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Install AnyDesk
        run: |
          choco install anydesk --yes

      - name: Disable Request System via Token Injection
        run: |
          # 1. Stop the background service to allow file editing
          Stop-Service -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
          
          # 2. Force the password into the binary configuration
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password "GitHubAdminPassword123!"
          
          # 3. Target the system configuration directory
          $TargetDir = "$env:ProgramData\AnyDesk"
          if (!(Test-Path $TargetDir)) { New-Item -ItemType Directory -Path $TargetDir -Force }
          $ConfigPath = "$TargetDir\system.conf"
          
          # 4. Inject strict keys to disable the "Accept" dialog completely
          # ad.security.interactive_auth=2 completely disables incoming request popups
          # ad.security.allow_unattended=1 forces immediate login via password authentication
          Clear-Content -Path $ConfigPath -ErrorAction SilentlyContinue
          Add-Content -Path $ConfigPath -Value "ad.security.interactive_auth=2"
          Add-Content -Path $ConfigPath -Value "ad.security.allow_unattended=1"
          Add-Content -Path $ConfigPath -Value "ad.security.allow_control=1"
          Add-Content -Path $ConfigPath -Value "ad.security.allow_view=1"
          Add-Content -Path $ConfigPath -Value "ad.security.allow_clip=1"
          Add-Content -Path $ConfigPath -Value "ad.security.allow_audio=0"
          Add-Content -Path $ConfigPath -Value "ad.features.incoming.direct_connection=1"

          # 5. Mirror the direct configurations to the local user profile
          $UserDir = "$env:AppData\AnyDesk"
          if (!(Test-Path $UserDir)) { New-Item -ItemType Directory -Path $UserDir -Force }
          $UserConfig = "$UserDir\user.conf"
          Clear-Content -Path $UserConfig -ErrorAction SilentlyContinue
          Add-Content -Path $UserConfig -Value "ad.security.interactive_auth=2"
          Add-Content -Path $UserConfig -Value "ad.security.allow_unattended=1"

          # 6. Apply Network Firewall rules for AnyDesk
          New-NetFirewallRule -DisplayName "AnyDesk Inbound" -Direction Inbound -Program "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" -Action Allow -Enabled True
          New-NetFirewallRule -DisplayName "AnyDesk Outbound" -Direction Outbound -Program "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" -Action Allow -Enabled True

          # 7. Restart the service to apply the automatic acceptance loop
          Start-Service -Name "AnyDesk"

      - name: Display AnyDesk ID
        run: |
          Start-Sleep -s 7
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id

      - name: Maintain Active Session
        run: |
          Start-Sleep -s 3600
