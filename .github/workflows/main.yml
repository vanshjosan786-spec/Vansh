name: AnyDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Download AnyDesk
        run: |
          Invoke-WebRequest -Uri "https://anydesk.com" -OutFile "AnyDesk.exe"

      - name: Install / Start AnyDesk
        run: |
          Start-Process -FilePath "AnyDesk.exe" -ArgumentList "--install c:\anydesk --silent --create-shortcuts" -Wait
          # Or run portably and set a temporary password
          # & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password "YourChosenPassword123"

      - name: Get AnyDesk ID
        run: |
          # Retrieve the AnyDesk ID from the client configuration/CLI
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          Write-Host "Check the console logs above or set a fixed password to connect."

      - name: Keep Runner Alive
        run: |
          Start-Sleep -s 3600

