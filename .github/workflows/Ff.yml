name: AnyDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Install AnyDesk
        run: |
          choco install anydesk --yes

      - name: Set AnyDesk Password
        run: |
          # Use the default Chocolatey path to configure a temporary password
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password "YourChosenPassword123"

      - name: Get AnyDesk ID
        run: |
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id

      - name: Keep Runner Alive
        run: |
          Start-Sleep -s 3600
